<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos - Boulet du mois</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="photos">
<div class="wrap">
  <nav id="nav"></nav>
  <main id="app"></main>
  <footer>Boulet du mois</footer>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
App.ready.then(function () {
  var $ = App.$, esc = App.esc;
  // Le jour de la révélation, on arrive sur les photos à voter. Ensuite, sur celles du dernier cycle terminé
  // (avec la photo gagnante). Sinon sur le cycle en cours (photos cachées).
  var viewKey = (function () {
    var vk = App.voteKey();
    if (vk) return vk;
    var cur = App.currentKey(), last = App.prevKey(cur);
    return (App.photosOf(last).length && App.resultsVisible(last)) ? last : cur;
  })();
  var uploader = App.getVoter() || App.PEOPLE[0].n;
  var pending = [];
  var caption = "";

  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

  function lockedCard(p) {
    return '<div class="ph locked">' +
      (App.isAdmin() ? '<button class="x del" data-del="' + p.id + '" title="Supprimer (admin)">×</button>' : '') +
      '<div class="img lock"><span>Photo cachée<br>jusqu\'au ' + App.CYCLE_DAY + '</span></div>' +
      '<div class="meta"><div class="by">' + App.av(App.person(p.who)) + esc(p.who) + '</div></div></div>';
  }

  function voteCard(p, n, ctx) {
    var mine = ctx.voter && App.myVote(viewKey, ctx.voter) === p.id;
    var own = ctx.voter && p.who === ctx.voter;
    return '<div class="ph">' +
      '<div class="img" data-open="' + p.id + '"><img src="' + p.data + '" alt=""></div>' +
      '<div class="meta">' +
        '<div class="by">Photo ' + n + '</div>' +
        (p.caption ? '<div class="cap">' + esc(p.caption) + '</div>' : '') +
        '<button class="vote-btn ' + (mine ? 'on' : '') + '" data-vote="' + p.id + '" ' + (own ? 'disabled' : '') + '>' +
          (own ? 'Ta photo' : mine ? 'Ton vote' : 'Voter pour cette photo') + '</button>' +
      '</div></div>';
  }

  function resultCard(p, ctx) {
    var isWin = ctx.results.winners.some(function (w) { return w.id === p.id; });
    return '<div class="ph ' + (isWin ? 'win' : '') + '">' +
      (isWin ? '<div class="badge">' + App.crownInline + 'Photo du mois</div>' : '') +
      '<div class="img" data-open="' + p.id + '"><img src="' + p.data + '" alt=""></div>' +
      '<div class="meta">' +
        '<div class="by">' + App.av(App.person(p.who)) + esc(p.who) + '</div>' +
        (p.caption ? '<div class="cap">' + esc(p.caption) + '</div>' : '') +
        '<div class="votes">' + App.plural(ctx.results.scores[p.id] || 0, "vote") + '</div>' +
      '</div></div>';
  }

  function render() {
    var cur = App.currentKey();
    var visible = App.photosVisible(viewKey);
    var voteOpen = App.isVoteOpen(viewKey);
    var resultsVis = App.resultsVisible(viewKey);
    var voter = App.getVoter();
    var list = App.photosOf(viewKey);
    var results = App.photoResults(viewKey);
    var photoKeys = App.photos.map(App.photoKey).concat(App.voteKey() ? [App.voteKey()] : []);
    var ctx = { voter: voter, results: results };

    var html =
      '<section class="hero">' +
        '<span class="eyebrow">Concours photo</span>' +
        '<h1>Photos</h1>' +
        '<p>Les photos restent cachées pendant tout le cycle. Elles sont dévoilées le ' + App.CYCLE_DAY + ', et le vote a lieu ce jour-là.</p>' +
      '</section>' +

      '<section class="glass">' +
        '<h2>Ajouter une photo (cycle de ' + App.monthName(cur).split(" ")[0].toLowerCase() + ')</h2>' +
        '<div class="pick">' + App.PEOPLE.map(function (p) {
          return '<button type="button" class="chip ' + (uploader === p.n ? 'on' : '') + '" data-up="' + p.n + '">' + App.av(p) + p.n +
            ' <small>' + App.photoCount(cur, p.n) + '/' + App.MAX_PHOTOS + '</small></button>';
        }).join("") + '</div>' +
        '<label class="drop" id="drop"><input type="file" id="file" accept="image/*" multiple>' +
          '<b>Clique ici</b> ou glisse tes photos<br><span style="font-size:.85rem">Elles sont réduites automatiquement et restent cachées jusqu\'au ' + App.CYCLE_DAY + '. Maximum ' + App.MAX_PHOTOS + ' photos par personne et par cycle.</span></label>' +
        (pending.length ? '<div class="previews" id="prev"></div>' : '') +
        '<div class="row-input">' +
          '<input type="text" id="cap" placeholder="Légende (optionnel)" maxlength="120" value="' + esc(caption) + '">' +
          '<button class="btn" id="up">Publier' + (pending.length ? ' (' + pending.length + ')' : '') + '</button>' +
        '</div>' +
      '</section>';

    html += '<section class="glass"><div class="head-row"><h2>Galerie</h2>' + App.cycleOptions(viewKey, photoKeys) + '</div>' +
      '<p class="muted" style="margin:-8px 0 14px;font-size:.9rem">Cycle ' + App.cycleRange(viewKey) + '. ' + App.plural(list.length, "photo") + '.</p>';

    if (!visible) {
      html += '<div class="notice">Les photos de ce cycle sont cachées jusqu\'au ' + App.CYCLE_DAY + '. Ce jour-là elles seront dévoilées et tout le monde pourra voter, de façon anonyme.</div>';
    } else if (voteOpen) {
      html += '<div class="notice">Le vote est ouvert aujourd\'hui. Choisis qui tu es, puis vote pour ta photo préférée (pas la tienne). Les photos sont anonymes et tu peux changer ton vote jusqu\'à la fin de la journée. Résultat à partir du ' + (App.CYCLE_DAY + 1) + '.' +
        '<div class="pick" style="margin:12px 0 0">' + App.PEOPLE.map(function (p) {
          return '<button type="button" class="chip ' + (voter === p.n ? 'on' : '') + '" data-voter="' + p.n + '">' + App.av(p) + p.n + '</button>';
        }).join("") + '</div></div>';
    } else if (results.winners.length) {
      var names = results.winners.map(function (p) { return p.who; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(" & ");
      html += '<div class="notice">Photo du mois : <b>' + esc(names) + '</b> avec ' + App.plural(results.max, "vote") + '.</div>';
    } else if (list.length) {
      html += '<div class="notice">Aucun vote enregistré sur ce cycle.</div>';
    }

    if (!list.length) {
      html += '<div class="empty">Aucune photo sur ce cycle.</div>';
    } else if (!visible) {
      html += '<div class="gallery">' + list.map(lockedCard).join("") + '</div>';
    } else if (voteOpen) {
      var shuffled = list.slice().sort(function (a, b) { return hash(a.id) - hash(b.id); });
      html += '<div class="gallery">' + shuffled.map(function (p, i) { return voteCard(p, i + 1, ctx); }).join("") + '</div>';
    } else if (resultsVis) {
      html += '<div class="gallery">' + list.map(function (p) { return resultCard(p, ctx); }).join("") + '</div>';
    }
    html += '</section>';

    html += '<section class="glass"><h2>Test</h2><div class="toolbar">' +
      '<button class="btn ghost" id="force">' + (App.force[cur] ? 'Quitter le mode test' : 'Mode test : dévoiler et voter maintenant') + '</button>' +
      '<span class="muted" style="font-size:.85rem">Pour essayer le vote avant le ' + App.CYCLE_DAY + ' (dévoile les photos du cycle en cours sur cet appareil).</span></div></section>';

    $("app").innerHTML = html;

    $("cycleSel").onchange = function () { viewKey = this.value; render(); };

    // Ajout
    document.querySelectorAll("[data-up]").forEach(function (c) { c.onclick = function () { uploader = c.dataset.up; caption = $("cap").value; render(); }; });
    var file = $("file"), drop = $("drop");
    file.onchange = function () { pending = pending.concat(Array.prototype.slice.call(file.files)); caption = $("cap").value; render(); };
    drop.ondragover = function (e) { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = function () { drop.classList.remove("over"); };
    drop.ondrop = function (e) {
      e.preventDefault(); drop.classList.remove("over");
      pending = pending.concat(Array.prototype.slice.call(e.dataTransfer.files));
      caption = $("cap").value; render();
    };
    if (pending.length) {
      var prev = $("prev");
      pending.forEach(function (f) { var im = document.createElement("img"); im.src = URL.createObjectURL(f); prev.appendChild(im); });
    }
    $("up").onclick = async function () {
      caption = $("cap").value.trim();
      if (!pending.length) { App.toast("Choisis au moins une photo"); return; }
      var btn = $("up"); btn.disabled = true; btn.textContent = "Envoi en cours...";
      var ok = 0, err = null;
      for (var i = 0; i < pending.length; i++) {
        try { await App.addPhoto(uploader, caption, pending[i]); ok++; }
        catch (e) { err = e.message; break; }
      }
      pending = []; caption = "";
      viewKey = App.currentKey();   // on montre le cycle en cours pour voir la photo déposée (cachée)
      render();
      App.toast(err ? (ok ? ok + " ajoutée(s). " : "") + err : App.plural(ok, "photo") + " ajoutée" + (ok > 1 ? "s" : "") + " pour " + uploader + " (cachée jusqu'au " + App.CYCLE_DAY + ")");
    };
    $("force").onclick = function () {
      if (App.force[cur]) delete App.force[cur]; else App.force[cur] = true;
      App.saveForce(); render();
    };

    // Vote
    document.querySelectorAll("[data-voter]").forEach(function (c) { c.onclick = function () { App.setVoter(c.dataset.voter); render(); }; });
    document.querySelectorAll("[data-vote]").forEach(function (b) {
      b.onclick = function () {
        if (!App.getVoter()) { App.toast("Choisis d'abord qui tu es"); return; }
        App.castVote(viewKey, App.getVoter(), b.dataset.vote).then(function (ok) {
          if (ok) { App.toast("Vote enregistré pour " + App.getVoter()); render(); }
        }, function (err) { App.toast("Erreur : " + err.message); });
      };
    });

    // Lightbox et suppression (suppression possible uniquement tant que les photos sont cachées)
    document.querySelectorAll("[data-open]").forEach(function (el) {
      el.onclick = function () {
        var p = App.photos.find(function (x) { return x.id === el.dataset.open; });
        if (p) App.lightbox(p.data, resultsVis ? p.who + (p.caption ? " : " + p.caption : "") : (p.caption || ""));
      };
    });
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = async function () {
        if (confirm("Supprimer cette photo ?")) {
          try { await App.delPhoto(b.dataset.del); render(); } catch (err) { App.toast("Erreur : " + err.message); }
        }
      };
    });
  }
  render();
});
</script>
</body>
</html>
