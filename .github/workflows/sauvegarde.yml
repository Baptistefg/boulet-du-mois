name: Sauvegarde mensuelle

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export de la base
        run: python3 .github/scripts/sauvegarde.py

      - name: Enregistrer la sauvegarde dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "Rien de nouveau à sauvegarder."
          else
            git commit -m "Sauvegarde du $(date +%Y-%m-%d)"
            git push
          fi
