<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Septembre 2026 - Juif du mois</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="sept">
<div class="wrap">
  <nav id="nav"></nav>
  <main id="app"></main>
  <footer>Juif du mois</footer>
</div>
<script src="app.js"></script>
<script>
App.ready.then(function () {
  var $ = App.$, esc = App.esc;
  var selected = [];

  function render() {
    var saved = App.overrides[App.SEP];
    if (saved && !selected.length) selected = saved.names.slice();
    var w = App.winnersOf(App.SEP);

    var result = saved
      ? '<div class="result">' +
          '<div class="eyebrow">Le verdict est tombé</div>' +
          '<div class="big">' + App.crownInline + w.names.join(" & ") + '</div>' +
          (saved.note ? '<p class="muted" style="margin:10px auto 0;max-width:520px">« ' + esc(saved.note) + ' »</p>' : '') +
          '<div class="toolbar" style="justify-content:center;margin-top:20px">' +
            '<button class="btn" id="replay">Revoir l\'annonce</button>' +
            '<button class="btn ghost" id="reset">Modifier le choix</button>' +
          '</div>' +
        '</div>'
      : '';

    $("app").innerHTML =
      '<section class="hero">' +
        '<span class="eyebrow">Édition spéciale</span>' +
        '<h1>Septembre 2026</h1>' +
        '<p>Cycle ' + App.cycleRange(App.SEP) + '. Le Juif de septembre a déjà été élu entre nous : on le saisit ici pour garder la trace dans l\'historique.</p>' +
      '</section>' +

      (saved
        ? '<section class="glass">' + result + '</section>'
        : '<section class="glass">' +
            '<h2>Qui est le Juif de septembre ?</h2>' +
            '<div class="cards">' + App.PEOPLE.map(function (p) {
              return '<button class="pcard ' + (selected.indexOf(p.n) >= 0 ? 'on' : '') + '" data-p="' + p.n + '">' + App.av(p) + '<b>' + p.n + '</b></button>';
            }).join("") + '</div>' +
            '<p class="muted" style="font-size:.85rem;margin:-4px 0 14px">Clique sur plusieurs noms en cas d\'égalité.</p>' +
            '<textarea id="note" placeholder="Pourquoi lui ? (optionnel, s\'affichera sous l\'annonce)" maxlength="200"></textarea>' +
            '<div style="text-align:center;margin-top:18px"><button class="btn" id="launch" style="font-size:1.05rem;padding:16px 34px">Enregistrer et lancer l\'annonce</button></div>' +
          '</section>') +

      '<section class="glass">' +
        '<h2>À partir d\'octobre</h2>' +
        '<p class="muted" style="margin:0">Dès le cycle d\'octobre (du 25 septembre au 24 octobre), le Juif du mois est calculé uniquement avec les mauvaises actions ajoutées sur le site. Cette page ne sert que pour septembre.</p>' +
      '</section>';

    if (!saved) {
      document.querySelectorAll(".pcard").forEach(function (c) {
        c.onclick = function () {
          var n = c.dataset.p, i = selected.indexOf(n);
          if (i >= 0) selected.splice(i, 1); else selected.push(n);
          c.classList.toggle("on", selected.indexOf(n) >= 0);
        };
      });
      $("launch").onclick = function () {
        if (!selected.length) { App.toast("Choisis au moins une personne"); return; }
        App.setSeptember(selected.slice(), $("note").value.trim());
        App.showReveal(App.SEP, true, render);
      };
    } else {
      $("replay").onclick = function () { App.showReveal(App.SEP, false, render); };
      $("reset").onclick = function () {
        if (confirm("Modifier le choix de septembre ?")) { App.clearSeptember(); selected = []; render(); }
      };
    }
  }
  render();
});
</script>
</body>
</html>
